    <!-- viewport-fit=cover : l'interface va sous l'encoche des téléphones
         récents. Le zoom reste AUTORISÉ, contrairement au client officiel :
         couper le pincement casse l'accessibilité pour rien. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Nom du produit : outil INDÉPENDANT, ce n'est pas l'application
         officielle Hengbot. La mention voyage donc jusque dans l'onglet du
         navigateur et dans les métadonnées de partage. -->
    <title>Studio 360 — pour Hengbot Sirius</title>
    <meta name="application-name" content="Studio 360 pour Sirius" />
    <meta name="description" content="Studio 360 pour Sirius (Studio 360) — kit de développement pour le robot quadrupède Hengbot Sirius. Projet indépendant, sans lien avec Hengbot : ce n'est pas l'application officielle." />

    <!-- Application installable : le robot se pilote naturellement depuis un
         téléphone posé dans la main. Tout est servi par le helper local, donc
         rien ne dépend d'Internet. -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icone-apple-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Studio 360" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- La couleur de la barre système suit le thème choisi. -->
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />

    <script>
      /* Thème appliqué AVANT le premier rendu. Sans ce bloc, la page s'affiche
         une fraction de seconde dans le thème par défaut avant que React ne
         rétablisse le thème enregistré : un flash blanc ou noir à chaque
         chargement. La logique est volontairement dupliquée ici (elle vit
         aussi dans lib/storage.ts) parce qu'elle doit tourner avant tout
         script de module. Les deux lisent la même clé et le même paramètre
         d'URL, ce que la suite de vérification contrôle. */
      (function () {
        try {
          var pref = null;
          var url = new URLSearchParams(window.location.search).get('theme');
          if (url === 'light' || url === 'dark' || url === 'auto') {
            pref = url;
          } else {
            var saved = localStorage.getItem('sirius.theme');
            if (saved === 'light' || saved === 'dark' || saved === 'auto') pref = saved;
          }
          if (!pref) pref = 'dark';
          var effectif = pref;
          if (pref === 'auto') {
            effectif = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          document.documentElement.setAttribute('data-theme', effectif);
        } catch (e) {
          /* stockage ou matchMedia indisponibles : le sombre du HTML reste */
        }
      })();
    </script>
